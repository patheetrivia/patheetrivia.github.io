<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact • Pathee Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="left-header">
      <a href="index.html"><img src="good_logo.png" alt="Pathee logo" class="logo-img" /></a>
    </div>
    <nav>
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="events.html">Public Events</a></li>
        <li><a href="testimonial.html">Testimonials</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
        <li><a href="question.html">Questions?</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contact Us</h2>
    <p>Tell us about your upcoming event, ask a question, or just say hi. We'll get back to you quickly.</p>

    <form class="contact" id="contact-form" action="https://formspree.io/f/mjkopnew" method="POST">
      <div class="row">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Give us the basics: location, headcount, date, company…"></textarea>
      </div>

      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

      <button type="submit">Send</button>
      <div id="status" aria-live="polite"></div>
    </form>

    <p class="instagram-note">
      Follow us on Instagram: <a href="https://instagram.com/patheetrivia" target="_blank" rel="noopener">@patheetrivia</a>
    </p>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Sending…';
      statusEl.className = '';

      try {
        const resp = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (resp.ok) {
          form.reset();
          statusEl.textContent = 'Thanks! Your message has been sent.';
          statusEl.className = 'success';
        } else {
          const data = await resp.json().catch(() => ({}));
          const msg = (data && data.errors && data.errors.map(e => e.message).join(', '))
                      || 'Something went wrong. Please try again.';
          statusEl.textContent = msg;
          statusEl.className = 'error';
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
        statusEl.className = 'error';
      }
    });
  </script>
</body>
</html>
